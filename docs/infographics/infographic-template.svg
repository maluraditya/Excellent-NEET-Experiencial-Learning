<?xml version="1.0" encoding="UTF-8"?>
<!--
  ============================================================================
  NCERT TOPIC INFOGRAPHIC — REUSABLE POSTER TEMPLATE
  ============================================================================
  Portrait poster, 1080 x 1350 (4:5). Self-contained: no external images,
  fonts, or scripts (so it exports cleanly to PNG and embeds anywhere).

  HOW TO USE
  1. Replace every {{PLACEHOLDER}} token with real content.
  2. Draw the topic's ONE hero diagram inside <g id="stage"> (leave the labels
     as leader lines pointing at its parts).
  3. Keep the layout, palette, and type classes below unchanged so every
     topic looks like one family.
  4. Export to PNG at 2x (2160 x 2700) for smartboard-crisp output.

  LAYOUT MAP
    Header band .............. y   0 - 150
    Left cards  (x 40,  w270)  L1 y 180-410 | L2 y 430-660
    Center stage (x 330-750) .. hero diagram + leader labels, y 180-800
    Right cards (x 770, w270)  R1 y 180-410 | R2 y 430-660
    Bottom row (3 cards) ...... y 700-1250
    Footer band .............. y 1250-1350
  ============================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <defs>
    <!-- PALETTE (edit here to rebrand):
         accent  #B3202F  header/chrome        highlight #FFC748  equation boxes
         ink     #1A2233  body text            muted     #5B6675  secondary text
         bg      #F5F8FC  page                 line      #E3E8F0  card borders
         Semantic diagram colors are per-topic (e.g. field #4338CA, current #F59E0B). -->
    <style>
      .title    { font-size: 46px; font-weight: 800; fill: #ffffff; letter-spacing: .5px; }
      .subtitle { font-size: 19px; font-weight: 600; fill: #FFC748; }
      .chip     { font-size: 13px; font-weight: 800; fill: #ffffff; }
      .cardTitle{ font-size: 18px; font-weight: 800; fill: #B3202F; letter-spacing: .3px; }
      .body     { font-size: 15.5px; font-weight: 400; fill: #1A2233; }
      .muted    { font-size: 13px;  font-weight: 400; fill: #5B6675; }
      .label    { font-size: 13px;  font-weight: 700; fill: #1A2233; }
      .formula  { font-size: 26px;  font-weight: 800; fill: #1A2233; font-family: 'Cambria Math', Georgia, serif; }
      .footer   { font-size: 14px;  font-weight: 600; fill: #5B6675; }
      .leader   { stroke: #9AA6B4; stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1A2233" flood-opacity="0.08"/>
    </filter>
    <marker id="lead" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <circle cx="3.5" cy="3.5" r="2.4" fill="#9AA6B4"/>
    </marker>
  </defs>

  <!-- PAGE -->
  <rect width="1080" height="1350" fill="#F5F8FC"/>

  <!-- ============ HEADER ============ -->
  <rect x="0" y="0" width="1080" height="150" fill="#B3202F"/>
  <rect x="0" y="150" width="1080" height="5" fill="#FFC748"/>
  <text class="title"    x="48" y="72">{{TITLE_UPPERCASE}}</text>
  <text class="subtitle" x="48" y="106">{{ONE_LINE_SUBTITLE}}</text>
  <rect x="890" y="52" width="150" height="30" rx="15" fill="rgba(255,255,255,0.16)"/>
  <text class="chip" x="965" y="72" text-anchor="middle">{{NCERT_REF}}</text>

  <!-- ============ CENTRAL STAGE — the ONE hero diagram ============ -->
  <!-- Draw the topic's core illustration here. Use semantic colors and keep it
       centered in x 330-750. Add leader lines from parts to the labels below. -->
  <g id="stage">
    <rect x="336" y="200" width="408" height="560" rx="18" fill="#ffffff" stroke="#E3E8F0" stroke-dasharray="6 5"/>
    <text class="muted" x="540" y="470" text-anchor="middle">‹ hero illustration ›</text>
    <text class="muted" x="540" y="492" text-anchor="middle">{{CENTRAL_DIAGRAM_DESCRIPTION}}</text>

    <!-- Leader-line labels (repeat as needed; point at diagram parts) -->
    <path class="leader" d="M 336 300 L 300 300" marker-end="url(#lead)"/>
    <text class="label" x="294" y="304" text-anchor="end">{{LABEL_1}}</text>
    <path class="leader" d="M 744 340 L 780 340" marker-end="url(#lead)"/>
    <text class="label" x="786" y="344">{{LABEL_2}}</text>
  </g>

  <!-- ============ LEFT CARD 1 — DEFINITION ============ -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="180" width="272" height="230" rx="16" fill="#ffffff" stroke="#E3E8F0" stroke-width="1.5"/>
    <rect x="40" y="180" width="6" height="230" rx="3" fill="#B3202F"/>
  </g>
  <text class="cardTitle" x="62" y="214">WHAT IS {{TOPIC_SHORT}}?</text>
  <text class="body" x="62" y="248">• {{DEFINITION_BULLET_1}}</text>
  <text class="body" x="62" y="278">• {{DEFINITION_BULLET_2}}</text>
  <text class="body" x="62" y="308">• {{DEFINITION_BULLET_3}}</text>
  <text class="muted" x="62" y="344">{{ONE_LINE_SO_WHAT}}</text>

  <!-- ============ LEFT CARD 2 — CORE EQUATION ============ -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="430" width="272" height="230" rx="16" fill="#ffffff" stroke="#E3E8F0" stroke-width="1.5"/>
    <rect x="40" y="430" width="6" height="230" rx="3" fill="#FFC748"/>
  </g>
  <text class="cardTitle" x="62" y="464">CORE EQUATION</text>
  <rect x="62" y="482" width="228" height="60" rx="10" fill="#FFF7E6" stroke="#FCE4A6"/>
  <text class="formula" x="176" y="522" text-anchor="middle">{{MAIN_EQUATION}}</text>
  <text class="body" x="62" y="576">• {{TERM_MEANING_1}}</text>
  <text class="body" x="62" y="604">• {{TERM_MEANING_2}}</text>
  <text class="muted" x="62" y="638">{{EQUATION_INSIGHT}}</text>

  <!-- ============ RIGHT CARD 1 — KEY QUANTITY ============ -->
  <g filter="url(#cardShadow)">
    <rect x="768" y="180" width="272" height="230" rx="16" fill="#ffffff" stroke="#E3E8F0" stroke-width="1.5"/>
    <rect x="768" y="180" width="6" height="230" rx="3" fill="#4338CA"/>
  </g>
  <text class="cardTitle" x="790" y="214" fill="#4338CA">{{KEY_QUANTITY_TITLE}}</text>
  <rect x="790" y="232" width="228" height="52" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text class="formula" x="904" y="266" text-anchor="middle">{{KEY_QUANTITY_FORMULA}}</text>
  <text class="body" x="790" y="316">• {{QUANTITY_NOTE_1}}</text>
  <text class="body" x="790" y="344">• {{QUANTITY_NOTE_2}}</text>
  <text class="muted" x="790" y="380">Unit: {{UNIT}}</text>

  <!-- ============ RIGHT CARD 2 — THE LAW / MECHANISM ============ -->
  <g filter="url(#cardShadow)">
    <rect x="768" y="430" width="272" height="230" rx="16" fill="#ffffff" stroke="#E3E8F0" stroke-width="1.5"/>
    <rect x="768" y="430" width="6" height="230" rx="3" fill="#B3202F"/>
  </g>
  <text class="cardTitle" x="790" y="464">{{LAW_OR_MECHANISM_TITLE}}</text>
  <text class="body" x="790" y="498">{{LAW_LINE_1}}</text>
  <text class="body" x="790" y="524">{{LAW_LINE_2}}</text>
  <rect x="790" y="544" width="228" height="90" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
  <text class="label" x="904" y="580" text-anchor="middle" fill="#B3202F">{{LAW_KEY_EXAMPLE_1}}</text>
  <text class="label" x="904" y="604" text-anchor="middle" fill="#B3202F">{{LAW_KEY_EXAMPLE_2}}</text>

  <!-- ============ BOTTOM ROW — 3 cards ============ -->
  <!-- B1: HOW IT WORKS (step flow) -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="808" width="320" height="422" rx="16" fill="#ffffff" stroke="#E3E8F0" stroke-width="1.5"/>
    <rect x="40" y="808" width="6" height="422" rx="3" fill="#FFC748"/>
  </g>
  <text class="cardTitle" x="62" y="842">HOW IT WORKS</text>
  <!-- numbered steps: repeat this pair, y += 62 -->
  <circle cx="76" cy="882" r="13" fill="#B3202F"/><text x="76" y="887" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">1</text>
  <text class="body" x="100" y="880">{{STEP_1}}</text>
  <circle cx="76" cy="944" r="13" fill="#B3202F"/><text x="76" y="949" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">2</text>
  <text class="body" x="100" y="942">{{STEP_2}}</text>
  <circle cx="76" cy="1006" r="13" fill="#B3202F"/><text x="76" y="1011" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">3</text>
  <text class="body" x="100" y="1004">{{STEP_3}}</text>
  <circle cx="76" cy="1068" r="13" fill="#B3202F"/><text x="76" y="1073" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">4</text>
  <text class="body" x="100" y="1066">{{STEP_4}}</text>

  <!-- B2: COMMON MISCONCEPTIONS -->
  <g filter="url(#cardShadow)">
    <rect x="380" y="808" width="320" height="422" rx="16" fill="#ffffff" stroke="#E3E8F0" stroke-width="1.5"/>
    <rect x="380" y="808" width="6" height="422" rx="3" fill="#EA580C"/>
  </g>
  <text class="cardTitle" x="402" y="842" fill="#EA580C">⚠ COMMON MISCONCEPTIONS</text>
  <text class="body" x="402" y="884">✗ {{MISCONCEPTION_1}}</text>
  <text class="body" x="402" y="946">✗ {{MISCONCEPTION_2}}</text>
  <text class="body" x="402" y="1008">✗ {{MISCONCEPTION_3}}</text>
  <text class="muted" x="402" y="1070">✓ {{CORRECT_IDEA}}</text>

  <!-- B3: REAL-WORLD APPLICATIONS -->
  <g filter="url(#cardShadow)">
    <rect x="720" y="808" width="320" height="422" rx="16" fill="#ffffff" stroke="#E3E8F0" stroke-width="1.5"/>
    <rect x="720" y="808" width="6" height="422" rx="3" fill="#0E7490"/>
  </g>
  <text class="cardTitle" x="742" y="842" fill="#0E7490">REAL-WORLD USES</text>
  <text class="body" x="742" y="884">• {{APPLICATION_1}}</text>
  <text class="body" x="742" y="922">• {{APPLICATION_2}}</text>
  <text class="body" x="742" y="960">• {{APPLICATION_3}}</text>
  <text class="body" x="742" y="998">• {{APPLICATION_4}}</text>

  <!-- ============ FOOTER ============ -->
  <rect x="0" y="1250" width="1080" height="100" fill="#1A2233"/>
  <text class="footer" x="540" y="1306" text-anchor="middle" fill="#E3E8F0">{{FOOTER_CTA_OR_ATTRIBUTION}}</text>

</svg>
