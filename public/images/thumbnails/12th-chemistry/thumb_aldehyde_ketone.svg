<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Aldehyde vs ketone reactivity thumbnail">
  <rect width="640" height="360" rx="32" fill="#fff7ed"/>
  <text x="52" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#9a3412">Aldehyde vs Ketone</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#475569">Nucleophilic addition to C=O</text>

  <!-- aldehyde -->
  <g transform="translate(80 150)">
    <text x="70" y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#9a3412">Aldehyde</text>
    <g stroke="#9a3412" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="60" x2="60" y2="40"/>
      <line x1="60" y1="40" x2="120" y2="30"/>
      <line x1="56" y1="44" x2="116" y2="14"/>
    </g>
    <g fill="#fb923c" stroke="#9a3412" stroke-width="3">
      <circle cx="0" cy="60" r="15"/><circle cx="60" cy="40" r="16"/>
    </g>
    <circle cx="120" cy="22" r="18" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
    <text x="120" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#fff">O</text>
    <text x="0" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#475569">H</text>
    <rect x="20" y="108" width="118" height="24" rx="12" fill="#dcfce7"/>
    <text x="79" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#166534">more reactive</text>
  </g>

  <!-- divider -->
  <line x1="320" y1="120" x2="320" y2="300" stroke="#fed7aa" stroke-width="4"/>

  <!-- ketone -->
  <g transform="translate(380 150)">
    <text x="80" y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#9a3412">Ketone</text>
    <g stroke="#9a3412" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="60" x2="80" y2="40"/>
      <line x1="80" y1="40" x2="160" y2="60"/>
      <line x1="80" y1="40" x2="80" y2="-6"/>
      <line x1="86" y1="40" x2="86" y2="-6"/>
    </g>
    <g fill="#fb923c" stroke="#9a3412" stroke-width="3">
      <circle cx="0" cy="60" r="15"/><circle cx="80" cy="40" r="16"/><circle cx="160" cy="60" r="15"/>
    </g>
    <circle cx="83" cy="-18" r="18" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
    <text x="83" y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#fff">O</text>
    <rect x="22" y="108" width="120" height="24" rx="12" fill="#fee2e2"/>
    <text x="82" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#991b1b">steric + e⁻ donation</text>
  </g>
</svg>
