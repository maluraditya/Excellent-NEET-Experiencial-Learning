<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Colligative properties thumbnail">
  <rect width="640" height="360" rx="32" fill="#eff6ff"/>
  <text x="52" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#1e3a8a">Colligative Properties</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#475569">ΔT = i · K · m  ·  bp rise, fp fall</text>

  <!-- thermometer -->
  <g transform="translate(96 116)">
    <rect x="0" y="0" width="34" height="170" rx="17" fill="#fff" stroke="#1d4ed8" stroke-width="4"/>
    <circle cx="17" cy="196" r="26" fill="#ef4444"/>
    <rect x="9" y="120" width="16" height="80" fill="#ef4444"/>
    <rect x="9" y="120" width="16" height="6" fill="#1d4ed8"/>
    <!-- bp marker up -->
    <line x1="34" y1="30" x2="70" y2="30" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <text x="78" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#dc2626">bp ↑</text>
    <line x1="34" y1="60" x2="60" y2="60" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="68" y="65" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#94a3b8">pure</text>
    <!-- fp marker down -->
    <line x1="34" y1="150" x2="70" y2="150" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <text x="78" y="155" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#2563eb">fp ↓</text>
    <line x1="34" y1="120" x2="60" y2="120" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/>
  </g>

  <!-- solution beaker with solute -->
  <g transform="translate(360 130)">
    <path d="M0 0 H150 L132 180 H18 Z" fill="#fff" stroke="#1d4ed8" stroke-width="5" stroke-linejoin="round"/>
    <path d="M11 70 H139 L132 180 H18 Z" fill="#bfdbfe" opacity="0.85"/>
    <g fill="#1e3a8a">
      <circle cx="36" cy="104" r="6"/><circle cx="86" cy="92" r="6"/><circle cx="116" cy="120" r="6"/>
      <circle cx="56" cy="140" r="6"/><circle cx="100" cy="150" r="6"/><circle cx="40" cy="158" r="6"/>
    </g>
    <text x="75" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#1e3a8a">non-volatile solute</text>
  </g>
</svg>
