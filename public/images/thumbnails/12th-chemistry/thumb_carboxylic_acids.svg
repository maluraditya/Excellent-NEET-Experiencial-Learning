<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Carboxylic acids reactions and acidity thumbnail">
  <rect width="640" height="360" rx="32" fill="#fef2f2"/>
  <text x="52" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#991b1b">Carboxylic Acids</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#475569">Acidity &amp; carboxylate resonance</text>

  <!-- -COOH group -->
  <g transform="translate(80 150)">
    <g stroke="#991b1b" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="40" x2="56" y2="40"/>
      <line x1="56" y1="40" x2="56" y2="-6"/>
      <line x1="62" y1="40" x2="62" y2="-6"/>
      <line x1="56" y1="40" x2="108" y2="64"/>
    </g>
    <circle cx="0" cy="40" r="15" fill="#fca5a5" stroke="#991b1b" stroke-width="3"/>
    <text x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#7f1d1d">R</text>
    <circle cx="59" cy="40" r="15" fill="#fca5a5" stroke="#991b1b" stroke-width="3"/>
    <text x="59" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#7f1d1d">C</text>
    <circle cx="59" cy="-18" r="17" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
    <text x="59" y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#fff">O</text>
    <circle cx="116" cy="72" r="17" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
    <text x="116" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#fff">OH</text>
    <text x="60" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#991b1b">–COOH</text>
  </g>

  <!-- dissociation arrow + resonance -->
  <g transform="translate(250 160)">
    <path d="M0 0 H70" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
    <polygon points="70,-9 88,0 70,9" fill="#16a34a"/>
    <text x="40" y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#16a34a">−H⁺</text>
  </g>

  <!-- carboxylate with delocalised charge -->
  <g transform="translate(370 130)">
    <rect x="0" y="0" width="200" height="150" rx="14" fill="#fff" stroke="#fecaca" stroke-width="4"/>
    <text x="100" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#991b1b">carboxylate RCOO⁻</text>
    <!-- two equal C-O bonds -->
    <g transform="translate(100 86)">
      <line x1="-40" y1="0" x2="0" y2="0" stroke="#334155" stroke-width="4"/>
      <line x1="0" y1="0" x2="34" y2="-22" stroke="#334155" stroke-width="4"/>
      <line x1="0" y1="0" x2="34" y2="22" stroke="#334155" stroke-width="4"/>
      <path d="M30 -26 q22 26 0 52" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="5 4"/>
      <circle cx="34" cy="-22" r="11" fill="#ef4444"/>
      <circle cx="34" cy="22" r="11" fill="#ef4444"/>
      <text x="60" y="4" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#16a34a">½⁻</text>
    </g>
    <text x="100" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#475569">resonance stabilised</text>
  </g>
</svg>
