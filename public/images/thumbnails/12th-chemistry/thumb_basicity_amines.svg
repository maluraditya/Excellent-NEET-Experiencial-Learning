<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Basicity of amines thumbnail">
  <rect width="640" height="360" rx="32" fill="#eef2ff"/>
  <text x="52" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#3730a3">Basicity of Amines</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#475569">Lone pair on N · pKb trends</text>

  <!-- amine N with lone pair accepting H+ -->
  <g transform="translate(110 190)">
    <circle cx="0" cy="0" r="46" fill="#6366f1" stroke="#3730a3" stroke-width="4"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#fff">N</text>
    <!-- lone pair -->
    <circle cx="-30" cy="-36" r="6" fill="#fbbf24"/>
    <circle cx="-14" cy="-44" r="6" fill="#fbbf24"/>
    <text x="-58" y="-50" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#b45309">lone pair</text>
    <!-- R groups -->
    <line x1="-46" y1="10" x2="-86" y2="34" stroke="#3730a3" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="46" x2="0" y2="86" stroke="#3730a3" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- H+ approaching -->
  <g transform="translate(196 150)">
    <path d="M40 0 H0" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <polygon points="0,-9 -18,0 0,9" fill="#dc2626"/>
    <circle cx="62" cy="0" r="16" fill="#fecaca" stroke="#dc2626" stroke-width="3"/>
    <text x="62" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#991b1b">H⁺</text>
  </g>

  <!-- basicity order ladder -->
  <g transform="translate(330 122)">
    <rect x="0" y="0" width="250" height="166" rx="14" fill="#fff" stroke="#c7d2fe" stroke-width="4"/>
    <text x="125" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#3730a3">aqueous basicity</text>
    <g font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#475569">
      <text x="22" y="64">2° &gt; 1° &gt; 3° &gt; NH₃</text>
      <text x="22" y="98">aniline weakest</text>
      <text x="22" y="132">(resonance with ring)</text>
    </g>
    <path d="M222 50 V126" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
    <polygon points="216,126 222,140 228,126" fill="#f97316"/>
  </g>
</svg>
