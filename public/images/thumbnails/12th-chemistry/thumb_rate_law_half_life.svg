<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Rate laws and half-life thumbnail">
  <rect width="640" height="360" rx="32" fill="#fef2f2"/>
  <text x="52" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#991b1b">Rate Laws &amp; Half-life</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#475569">Zero-order vs first-order decay</text>

  <!-- plot -->
  <g transform="translate(96 116)">
    <rect x="0" y="0" width="340" height="200" rx="12" fill="#fff" stroke="#fecaca" stroke-width="4"/>
    <line x1="44" y1="170" x2="320" y2="170" stroke="#334155" stroke-width="3"/>
    <line x1="44" y1="20" x2="44" y2="170" stroke="#334155" stroke-width="3"/>
    <text x="182" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#475569">time t</text>
    <text x="22" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#475569" transform="rotate(-90 22 100)">[R]</text>
    <!-- zero order: straight line -->
    <line x1="44" y1="40" x2="240" y2="170" stroke="#2563eb" stroke-width="4"/>
    <!-- first order: exponential -->
    <path d="M44 40 Q120 150 320 165" fill="none" stroke="#ef4444" stroke-width="4"/>
  </g>

  <!-- legend / equations -->
  <g transform="translate(456 130)" font-family="Arial, sans-serif" font-size="14" font-weight="800">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#2563eb" stroke-width="4"/>
    <text x="34" y="5" fill="#2563eb">zero order</text>
    <text x="0" y="26" fill="#475569" font-size="13">[R]=[R]₀−kt</text>
    <line x1="0" y1="58" x2="26" y2="58" stroke="#ef4444" stroke-width="4"/>
    <text x="34" y="63" fill="#dc2626">first order</text>
    <text x="0" y="84" fill="#475569" font-size="13">[R]=[R]₀e⁻ᵏᵗ</text>
    <text x="0" y="124" fill="#991b1b" font-weight="900">t½ constant (1st)</text>
  </g>
</svg>
