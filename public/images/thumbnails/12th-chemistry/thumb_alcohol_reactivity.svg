<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Alcohol reactivity and hydrogen bonding thumbnail">
  <rect width="640" height="360" rx="32" fill="#ecfeff"/>
  <text x="52" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#155e75">Alcohol Reactivity</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#475569">1° · 2° · 3°  and  hydrogen bonding</text>

  <!-- ethanol molecule with OH -->
  <g transform="translate(80 150)">
    <g stroke="#0e7490" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="40" x2="48" y2="14"/>
      <line x1="48" y1="14" x2="96" y2="40"/>
      <line x1="96" y1="40" x2="140" y2="20"/>
    </g>
    <g fill="#67e8f9" stroke="#0e7490" stroke-width="3">
      <circle cx="0" cy="40" r="15"/><circle cx="48" cy="14" r="15"/><circle cx="96" cy="40" r="15"/>
    </g>
    <circle cx="140" cy="20" r="18" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
    <text x="140" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#fff">O</text>
    <circle cx="176" cy="8" r="13" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="176" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#0c4a6e">H</text>
    <text x="48" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#155e75">ethanol  C₂H₅OH</text>
  </g>

  <!-- H-bond to second OH -->
  <line x1="262" y1="158" x2="330" y2="158" stroke="#64748b" stroke-width="4" stroke-dasharray="4 8" stroke-linecap="round"/>
  <text x="296" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#475569">H-bond</text>
  <g transform="translate(348 138)">
    <circle cx="0" cy="0" r="18" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#fff">O</text>
    <circle cx="30" cy="-14" r="13" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="30" y="-9" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#0c4a6e">H</text>
  </g>

  <!-- reactivity ladder -->
  <g transform="translate(430 130)">
    <rect x="0" y="0" width="150" height="160" rx="14" fill="#fff" stroke="#a5f3fc" stroke-width="4"/>
    <text x="75" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#155e75">Lucas test</text>
    <g font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#475569">
      <text x="18" y="62">3°  fast</text>
      <text x="18" y="92">2°  slow</text>
      <text x="18" y="122">1°  no rxn</text>
    </g>
    <path d="M128 50 V120" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
    <polygon points="122,120 128,134 134,120" fill="#f97316"/>
  </g>
</svg>
