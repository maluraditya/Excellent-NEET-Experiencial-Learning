<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Glucose conformations thumbnail">
  <rect width="640" height="360" rx="32" fill="#ecfdf5"/>
  <text x="48" y="56" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#065f46">Glucose Conformations</text>
  <text x="48" y="86" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#475569">open chain · α / β anomers · mutarotation</text>

  <!-- open-chain (Fischer) hint, left -->
  <g transform="translate(86 150)">
    <line x1="0" y1="0" x2="0" y2="150" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="15" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#b91c1c">1</text>
    <text x="34" y="-6" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#dc2626">CHO</text>
    <g fill="#e2e8f0" stroke="#334155" stroke-width="2.5">
      <circle cx="0" cy="38" r="12"/><circle cx="0" cy="76" r="12"/><circle cx="0" cy="114" r="12"/>
    </g>
    <circle cx="0" cy="150" r="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="0" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#15803d">6</text>
    <text x="0" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#16a34a">CH₂OH</text>
  </g>

  <!-- equilibrium arrows -->
  <g stroke="#0891b2" stroke-width="3.5" stroke-linecap="round">
    <line x1="170" y1="178" x2="240" y2="178"/>
    <line x1="240" y1="192" x2="170" y2="192"/>
  </g>
  <polygon points="240,178 230,172 230,184" fill="#0891b2"/>
  <polygon points="170,192 180,186 180,198" fill="#0891b2"/>

  <!-- Haworth pyranose ring, right -->
  <g transform="translate(430 200)">
    <polygon points="0,-86 75,-43 75,43 0,86 -75,43 -75,-43" fill="rgba(16,185,129,0.10)"/>
    <!-- ring edges (front thicker) -->
    <g stroke="#475569" fill="none" stroke-linecap="round">
      <line x1="0" y1="-86" x2="75" y2="-43" stroke-width="3.5"/>
      <line x1="75" y1="-43" x2="75" y2="43" stroke-width="3.5"/>
      <line x1="75" y1="43" x2="0" y2="86" stroke-width="6"/>
      <line x1="0" y1="86" x2="-75" y2="43" stroke-width="6"/>
      <line x1="-75" y1="43" x2="-75" y2="-43" stroke-width="6"/>
      <line x1="-75" y1="-43" x2="0" y2="-86" stroke-width="3.5"/>
    </g>
    <!-- ring O (upper right) -->
    <circle cx="75" cy="-43" r="16" fill="#fde68a" stroke="#92400e" stroke-width="2.5"/>
    <text x="75" y="-38" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#92400e">O</text>
    <!-- C6 CH2OH up from top vertex (C5) -->
    <line x1="0" y1="-86" x2="0" y2="-120" stroke="#15803d" stroke-width="3"/>
    <circle cx="0" cy="-134" r="13" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
    <text x="0" y="-130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#15803d">6</text>
    <text x="0" y="-152" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#16a34a">CH₂OH</text>
    <!-- ring carbons -->
    <g fill="#e2e8f0" stroke="#334155" stroke-width="2.5">
      <circle cx="-75" cy="-43" r="13"/><circle cx="-75" cy="43" r="13"/><circle cx="0" cy="86" r="13"/>
    </g>
    <!-- anomeric C1 (lower right) highlighted -->
    <circle cx="75" cy="43" r="26" fill="none" stroke="#7c3aed" stroke-width="3" opacity="0.5"/>
    <circle cx="75" cy="43" r="15" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
    <text x="75" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#6d28d9">1</text>
    <!-- C1 OH (β = up) and label -->
    <line x1="75" y1="43" x2="75" y2="76" stroke="#7c3aed" stroke-width="3"/>
    <text x="98" y="80" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#7c3aed">OH</text>
    <text x="0" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#0f766e">α / β anomer</text>
  </g>
</svg>
