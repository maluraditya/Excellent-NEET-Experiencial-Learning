<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Mole concept and limiting reagent thumbnail">
  <rect width="640" height="360" rx="32" fill="#ecfeff"/>
  <text x="52" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#155e75">Mole Concept</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#475569">Limiting reagent &amp; stoichiometry</text>

  <!-- reaction H2 + O2 -> H2O -->
  <g transform="translate(70 150)">
    <!-- reactant A : 2 H2 -->
    <g>
      <circle cx="30" cy="20" r="18" fill="#22d3ee" stroke="#0e7490" stroke-width="3"/>
      <circle cx="30" cy="64" r="18" fill="#22d3ee" stroke="#0e7490" stroke-width="3"/>
      <text x="30" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#155e75">2 H₂</text>
    </g>
    <text x="78" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#64748b">+</text>
    <!-- reactant B : 1 O2 (limiting) -->
    <g>
      <circle cx="124" cy="42" r="20" fill="#fb7185" stroke="#be123c" stroke-width="3"/>
      <text x="124" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#be123c">1 O₂</text>
      <rect x="92" y="132" width="66" height="22" rx="11" fill="#fee2e2"/>
      <text x="125" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#be123c">limiting</text>
    </g>
    <!-- arrow -->
    <path d="M168 42 H236" stroke="#0e7490" stroke-width="5" stroke-linecap="round"/>
    <polygon points="236,33 254,42 236,51" fill="#0e7490"/>
    <!-- product 2 H2O -->
    <g transform="translate(280 0)">
      <circle cx="20" cy="20" r="16" fill="#fb7185" stroke="#be123c" stroke-width="3"/>
      <circle cx="4" cy="6" r="9" fill="#22d3ee" stroke="#0e7490" stroke-width="2"/>
      <circle cx="36" cy="6" r="9" fill="#22d3ee" stroke="#0e7490" stroke-width="2"/>
      <circle cx="20" cy="64" r="16" fill="#fb7185" stroke="#be123c" stroke-width="3"/>
      <circle cx="4" cy="50" r="9" fill="#22d3ee" stroke="#0e7490" stroke-width="2"/>
      <circle cx="36" cy="50" r="9" fill="#22d3ee" stroke="#0e7490" stroke-width="2"/>
      <text x="20" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#155e75">2 H₂O</text>
    </g>
  </g>

  <!-- mole = 6.022e23 chip -->
  <g transform="translate(388 300)">
    <rect x="0" y="0" width="196" height="34" rx="17" fill="#fff" stroke="#67e8f9" stroke-width="3"/>
    <text x="98" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#155e75">1 mol = 6.022 × 10²³</text>
  </g>
</svg>
