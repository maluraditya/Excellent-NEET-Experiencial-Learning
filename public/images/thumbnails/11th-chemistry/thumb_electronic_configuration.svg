<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Electronic configuration thumbnail">
  <rect width="640" height="360" rx="32" fill="#eef2ff"/>
  <text x="52" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#312e81">Electronic Configuration</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#475569">Aufbau · Pauli · Hund · exchange energy</text>

  <!-- orbital boxes: half-filled 3d5 -->
  <g transform="translate(70 150)">
    <text x="0" y="-14" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#3730a3">3d⁵  (half-filled, stable)</text>
    <g>
      <rect x="0" y="0" width="44" height="44" rx="6" fill="#fff" stroke="#6366f1" stroke-width="3"/>
      <rect x="52" y="0" width="44" height="44" rx="6" fill="#fff" stroke="#6366f1" stroke-width="3"/>
      <rect x="104" y="0" width="44" height="44" rx="6" fill="#fff" stroke="#6366f1" stroke-width="3"/>
      <rect x="156" y="0" width="44" height="44" rx="6" fill="#fff" stroke="#6366f1" stroke-width="3"/>
      <rect x="208" y="0" width="44" height="44" rx="6" fill="#fff" stroke="#6366f1" stroke-width="3"/>
    </g>
    <g stroke="#4f46e5" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M22 38 V8 M16 16 L22 8 L28 16"/>
      <path d="M74 38 V8 M68 16 L74 8 L80 16"/>
      <path d="M126 38 V8 M120 16 L126 8 L132 16"/>
      <path d="M178 38 V8 M172 16 L178 8 L184 16"/>
      <path d="M230 38 V8 M224 16 L230 8 L236 16"/>
    </g>
  </g>

  <!-- subshell filling order ladder -->
  <g transform="translate(430 130)">
    <rect x="0" y="0" width="150" height="172" rx="16" fill="#fff" stroke="#c7d2fe" stroke-width="4"/>
    <g font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#475569">
      <text x="22" y="34">1s</text>
      <text x="22" y="64">2s 2p</text>
      <text x="22" y="94">3s 3p</text>
      <text x="22" y="124">4s 3d</text>
      <text x="22" y="154">4p 5s</text>
    </g>
    <path d="M118 24 L40 150" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
    <polygon points="40,150 52,140 54,156" fill="#f97316"/>
    <text x="92" y="-12" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#f97316">energy</text>
  </g>
</svg>
