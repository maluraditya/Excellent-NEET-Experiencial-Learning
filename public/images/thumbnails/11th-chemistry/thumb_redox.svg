<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Redox and oxidation number thumbnail">
  <rect width="640" height="360" rx="32" fill="#fef2f2"/>
  <text x="52" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#991b1b">Redox Reactions</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#475569">Oxidation number &amp; electron transfer</text>

  <!-- two atoms -->
  <g transform="translate(110 200)">
    <circle cx="0" cy="0" r="56" fill="#fff" stroke="#dc2626" stroke-width="5"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#991b1b">Zn</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#dc2626">0 → +2</text>
    <text x="0" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#dc2626">oxidation</text>
  </g>

  <g transform="translate(380 200)">
    <circle cx="0" cy="0" r="56" fill="#fff" stroke="#2563eb" stroke-width="5"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#1e40af">Cu²⁺</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#2563eb">+2 → 0</text>
    <text x="0" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#2563eb">reduction</text>
  </g>

  <!-- electron transfer arc -->
  <path d="M150 150 C 230 90, 310 90, 360 150" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <polygon points="360,150 342,142 350,160" fill="#16a34a"/>
  <g transform="translate(248 108)">
    <circle cx="0" cy="0" r="15" fill="#16a34a"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#fff">e⁻</text>
  </g>
  <text x="256" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#16a34a">2 electrons</text>
</svg>
