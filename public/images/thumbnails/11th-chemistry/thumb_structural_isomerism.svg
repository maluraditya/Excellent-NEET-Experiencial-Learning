<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Structural isomerism thumbnail">
  <rect width="640" height="360" rx="32" fill="#fffbeb"/>
  <text x="52" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#92400e">Structural Isomerism</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#475569">Same formula  C₄H₁₀  ·  different structure</text>

  <!-- n-butane -->
  <g transform="translate(70 180)">
    <g stroke="#92400e" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="40" x2="50" y2="10"/>
      <line x1="50" y1="10" x2="100" y2="40"/>
      <line x1="100" y1="40" x2="150" y2="10"/>
    </g>
    <g fill="#f59e0b" stroke="#92400e" stroke-width="3">
      <circle cx="0" cy="40" r="16"/><circle cx="50" cy="10" r="16"/>
      <circle cx="100" cy="40" r="16"/><circle cx="150" cy="10" r="16"/>
    </g>
    <g fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="900" text-anchor="middle">
      <text x="0" y="45">C</text><text x="50" y="15">C</text>
      <text x="100" y="45">C</text><text x="150" y="15">C</text>
    </g>
    <text x="75" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#92400e">n-butane</text>
  </g>

  <!-- divider -->
  <line x1="320" y1="120" x2="320" y2="300" stroke="#fde68a" stroke-width="4"/>

  <!-- isobutane -->
  <g transform="translate(400 170)">
    <g stroke="#92400e" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="50" x2="60" y2="50"/>
      <line x1="60" y1="50" x2="120" y2="50"/>
      <line x1="60" y1="50" x2="60" y2="0"/>
    </g>
    <g fill="#f59e0b" stroke="#92400e" stroke-width="3">
      <circle cx="0" cy="50" r="16"/><circle cx="60" cy="50" r="16"/>
      <circle cx="120" cy="50" r="16"/><circle cx="60" cy="0" r="16"/>
    </g>
    <g fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="900" text-anchor="middle">
      <text x="0" y="55">C</text><text x="60" y="55">C</text>
      <text x="120" y="55">C</text><text x="60" y="5">C</text>
    </g>
    <text x="60" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#92400e">isobutane</text>
  </g>
</svg>
