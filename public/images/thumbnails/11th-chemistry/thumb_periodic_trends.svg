<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Periodic trends explorer thumbnail">
  <rect width="640" height="360" rx="32" fill="#f5f3ff"/>
  <text x="52" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#5b21b6">Periodic Trends</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#475569">Radius · ionisation · electronegativity</text>

