    <g fill="#c4b5fd">
      <rect x="0"   y="120" width="34" height="34" rx="5"/>
      <rect x="38"  y="120" width="34" height="34" rx="5"/>
      <rect x="76"  y="120" width="34" height="34" rx="5"/>
