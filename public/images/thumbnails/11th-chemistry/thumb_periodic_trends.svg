    <!-- row 2 -->
    <rect x="0"   y="40" width="34" height="34" rx="5" fill="#a78bfa"/>
    <rect x="38"  y="40" width="34" height="34" rx="5" fill="#a78bfa"/>
    <rect x="190" y="40" width="34" height="34" rx="5" fill="#8b5cf6"/>
    <rect x="228" y="40" width="34" height="34" rx="5" fill="#8b5cf6"/>
    <rect x="266" y="40" width="34" height="34" rx="5" fill="#7c3aed"/>
    <rect x="304" y="40" width="34" height="34" rx="5" fill="#7c3aed"/>
    <rect x="342" y="40" width="34" height="34" rx="5" fill="#6d28d9"/>
    <!-- row 3 -->
    <rect x="0"   y="80" width="34" height="34" rx="5" fill="#8b5cf6"/>
    <rect x="38"  y="80" width="34" height="34" rx="5" fill="#8b5cf6"/>
    <rect x="190" y="80" width="34" height="34" rx="5" fill="#7c3aed"/>
    <rect x="228" y="80" width="34" height="34" rx="5" fill="#7c3aed"/>
    <rect x="266" y="80" width="34" height="34" rx="5" fill="#6d28d9"/>
    <rect x="304" y="80" width="34" height="34" rx="5" fill="#6d28d9"/>
    <rect x="342" y="80" width="34" height="34" rx="5" fill="#5b21b6"/>
