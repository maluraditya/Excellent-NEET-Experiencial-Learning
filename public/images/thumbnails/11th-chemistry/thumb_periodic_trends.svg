  <text x="190" y="322" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#ef4444">electronegativity →</text>
  <text x="470" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#0ea5e9" transform="rotate(-90 470 180)">radius →</text>
