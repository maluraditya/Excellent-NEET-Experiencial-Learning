<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Heat work energy changes thumbnail">
  <rect width="640" height="360" rx="32" fill="#fff7ed"/>
  <text x="52" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#9a3412">Heat, Work &amp; Energy</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7c2d12">First law:  ΔU = q + w</text>

  <!-- cylinder with piston -->
  <g transform="translate(96 120)">
    <rect x="0" y="40" width="150" height="160" rx="8" fill="#fff" stroke="#9a3412" stroke-width="5"/>
    <rect x="0" y="40" width="150" height="100" fill="#fde68a"/>
    <!-- gas particles -->
    <g fill="#d97706">
      <circle cx="34" cy="78" r="6"/><circle cx="86" cy="64" r="6"/><circle cx="120" cy="96" r="6"/>
      <circle cx="58" cy="112" r="6"/><circle cx="104" cy="124" r="6"/><circle cx="40" cy="128" r="6"/>
    </g>
    <!-- piston -->
    <rect x="-6" y="24" width="162" height="20" rx="6" fill="#94a3b8"/>
    <rect x="66" y="-26" width="18" height="50" rx="4" fill="#64748b"/>
  </g>

  <!-- heat in arrow -->
  <g transform="translate(60 300)">
    <path d="M0 0 H120" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
    <polygon points="120,-9 138,0 120,9" fill="#ef4444"/>
    <text x="2" y="-12" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#ef4444">q  heat in</text>
  </g>

  <!-- work out arrow -->
  <g transform="translate(300 140)">
    <path d="M0 0 V-80" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <polygon points="-9,-80 0,-98 9,-80" fill="#2563eb"/>
    <text x="18" y="-50" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#2563eb">w  work</text>
  </g>

  <!-- energy boxes -->
  <g transform="translate(400 130)">
    <rect x="0" y="0" width="180" height="150" rx="16" fill="#fff" stroke="#fdba74" stroke-width="4"/>
    <text x="90" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#9a3412">ΔU = q + w</text>
    <line x1="20" y1="60" x2="160" y2="60" stroke="#fed7aa" stroke-width="3"/>
    <text x="20" y="92" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#475569">q &gt; 0 absorbed</text>
    <text x="20" y="118" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#475569">w &gt; 0 done on gas</text>
  </g>
</svg>
