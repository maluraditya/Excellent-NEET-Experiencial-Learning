<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Weak acid base ionization thumbnail">
  <rect width="640" height="360" rx="32" fill="#fdf4ff"/>
  <text x="52" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#86198f">Weak Acid / Base Ionization</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#475569">Equilibrium  HA ⇌ H⁺ + A⁻</text>

  <!-- beaker with partial dissociation -->
  <g transform="translate(80 116)">
    <path d="M0 0 H140 L122 180 H18 Z" fill="#fff" stroke="#a21caf" stroke-width="5" stroke-linejoin="round"/>
    <path d="M11 70 H129 L122 180 H18 Z" fill="#f0abfc" opacity="0.6"/>
    <!-- undissociated HA (most) -->
    <g font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#86198f">
      <text x="34" y="104">HA</text><text x="84" y="96">HA</text>
      <text x="52" y="140">HA</text><text x="96" y="150">HA</text>
    </g>
    <!-- few ions -->
    <g font-family="Arial, sans-serif" font-size="13" font-weight="900">
      <text x="34" y="170" fill="#dc2626">H⁺</text>
      <text x="92" y="124" fill="#2563eb">A⁻</text>
    </g>
    <text x="70" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#86198f">α small (partial)</text>
  </g>

  <!-- pH scale -->
  <g transform="translate(300 150)">
    <text x="0" y="-12" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#475569">pH scale</text>
    <defs>
      <linearGradient id="ph" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ef4444"/>
        <stop offset="0.5" stop-color="#22c55e"/>
        <stop offset="1" stop-color="#6d28d9"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="260" height="30" rx="15" fill="url(#ph)"/>
    <g font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#334155">
      <text x="0" y="52">0</text><text x="124" y="52">7</text><text x="244" y="52">14</text>
    </g>
    <!-- marker for weak acid ~ pH 4 -->
    <polygon points="74,-4 66,-18 82,-18" fill="#dc2626"/>
    <text x="74" y="-24" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#dc2626">weak acid</text>
    <rect x="0" y="86" width="260" height="34" rx="10" fill="#fff" stroke="#f0abfc" stroke-width="3"/>
    <text x="130" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#86198f">Ka × Kb = Kw</text>
  </g>
</svg>
