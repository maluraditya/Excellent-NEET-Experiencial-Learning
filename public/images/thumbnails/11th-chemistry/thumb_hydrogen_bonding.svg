<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Hydrogen bonding thumbnail">
  <rect width="640" height="360" rx="32" fill="#ecfeff"/>
  <text x="52" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#155e75">Hydrogen Bonding</text>
  <text x="52" y="88" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#475569">δ⁺ · δ⁻ dipoles &amp; dotted bridges</text>

  <!-- water molecule A -->
  <g transform="translate(150 175)">
    <circle cx="0" cy="0" r="38" fill="#ef4444" stroke="#991b1b" stroke-width="4"/>
    <text x="0" y="7" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#fff">O</text>
    <text x="-46" y="-30" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#dc2626">δ⁻</text>
    <circle cx="-42" cy="34" r="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="-42" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#0c4a6e">H</text>
    <circle cx="42" cy="34" r="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="42" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#0c4a6e">H</text>
    <text x="58" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#0284c7">δ⁺</text>
  </g>

  <!-- H bond dotted -->
  <line x1="208" y1="206" x2="338" y2="206" stroke="#64748b" stroke-width="4" stroke-dasharray="4 8" stroke-linecap="round"/>
  <text x="273" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#475569">H-bond</text>

  <!-- water molecule B -->
  <g transform="translate(400 175)">
    <circle cx="0" cy="0" r="38" fill="#ef4444" stroke="#991b1b" stroke-width="4"/>
    <text x="0" y="7" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#fff">O</text>
    <text x="34" y="-30" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#dc2626">δ⁻</text>
    <circle cx="-42" cy="34" r="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="-42" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#0c4a6e">H</text>
    <circle cx="42" cy="34" r="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="42" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#0c4a6e">H</text>
  </g>

  <g transform="translate(206 300)">
    <rect x="0" y="0" width="228" height="32" rx="16" fill="#fff" stroke="#67e8f9" stroke-width="3"/>
    <text x="114" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#155e75">high b.p. · high surface tension</text>
  </g>
</svg>
