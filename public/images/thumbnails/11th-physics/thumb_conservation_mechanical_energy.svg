<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="400" height="300" rx="16" fill="#f8fafc"/>
  <rect x="8" y="8" width="384" height="284" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="200" y="44" text-anchor="middle" font-size="16" font-weight="800" fill="#16a34a">E = K + U = constant</text>
  <!-- valley track -->
  <path d="M48 96 Q200 300 352 96" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <!-- ball at top (all PE) -->
  <circle cx="58" cy="100" r="13" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
  <text x="58" y="80" text-anchor="middle" font-size="12" font-weight="800" fill="#7c3aed">U max</text>
  <!-- ball at bottom (all KE) -->
  <circle cx="200" cy="208" r="13" fill="#0ea5e9" stroke="#0369a1" stroke-width="2"/>
  <text x="200" y="240" text-anchor="middle" font-size="12" font-weight="800" fill="#0284c7">K max</text>
  <!-- energy bars -->
  <rect x="296" y="150" width="26" height="58" rx="4" fill="#7c3aed" opacity="0.85"/>
  <rect x="330" y="174" width="26" height="34" rx="4" fill="#0ea5e9" opacity="0.85"/>
  <text x="309" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">U</text>
  <text x="343" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#0284c7">K</text>
  <text x="200" y="282" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">KE ⇄ PE, total energy fixed</text>
</svg>
