<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="400" height="300" rx="16" fill="#f8fafc"/>
  <rect x="8" y="8" width="384" height="284" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <!-- balance beam (level = balanced) -->
  <polygon points="200,150 180,232 220,232" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <line x1="90" y1="150" x2="310" y2="150" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="200" cy="150" r="7" fill="#475569"/>
  <!-- ropes + pans -->
  <line x1="120" y1="150" x2="120" y2="186" stroke="#94a3b8" stroke-width="2"/>
  <line x1="280" y1="150" x2="280" y2="186" stroke="#94a3b8" stroke-width="2"/>
  <rect x="74" y="186" width="92" height="46" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/>
  <text x="120" y="207" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">LHS</text>
  <text x="120" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">[M⁰L¹T⁰]</text>
  <rect x="234" y="186" width="92" height="46" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/>
  <text x="280" y="207" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">RHS</text>
  <text x="280" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">[M⁰L¹T⁰]</text>
  <!-- title -->
  <text x="200" y="58" text-anchor="middle" font-size="20" font-weight="800" fill="#1d4ed8">[ M L T ]</text>
  <text x="200" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">Principle of homogeneity</text>
</svg>
