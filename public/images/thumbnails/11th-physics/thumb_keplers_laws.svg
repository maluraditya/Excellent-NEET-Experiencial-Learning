<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="400" height="300" rx="16" fill="#f8fafc"/>
  <rect x="8" y="8" width="384" height="284" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="200" y="44" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">T² ∝ a³</text>
  <!-- elliptical orbit -->
  <ellipse cx="210" cy="168" rx="150" ry="92" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- sun at focus -->
  <circle cx="120" cy="168" r="20" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <!-- swept areas (equal) -->
  <path d="M120 168 L60 168 A150 92 0 0 1 96 98 Z" fill="#fde68a" opacity="0.8"/>
  <path d="M120 168 L356 152 A150 92 0 0 1 350 196 Z" fill="#fde68a" opacity="0.8"/>
  <!-- planet -->
  <circle cx="60" cy="168" r="10" fill="#0ea5e9" stroke="#0369a1" stroke-width="2"/>
  <circle cx="356" cy="152" r="8" fill="#0ea5e9" stroke="#0369a1" stroke-width="2"/>
  <text x="120" y="206" text-anchor="middle" font-size="11" font-weight="800" fill="#92400e">Sun</text>
  <text x="200" y="282" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b">equal areas in equal times</text>
</svg>
