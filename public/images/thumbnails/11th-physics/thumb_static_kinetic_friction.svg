<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="400" height="300" rx="16" fill="#f8fafc"/>
  <rect x="8" y="8" width="384" height="284" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="200" y="50" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">fₛ ≤ μₛN · fₖ = μₖN</text>
  <!-- ground with hatching -->
  <line x1="40" y1="210" x2="360" y2="210" stroke="#94a3b8" stroke-width="2.5"/>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="48" y1="210" x2="36" y2="224"/><line x1="78" y1="210" x2="66" y2="224"/><line x1="108" y1="210" x2="96" y2="224"/>
    <line x1="138" y1="210" x2="126" y2="224"/><line x1="168" y1="210" x2="156" y2="224"/><line x1="198" y1="210" x2="186" y2="224"/>
    <line x1="228" y1="210" x2="216" y2="224"/><line x1="258" y1="210" x2="246" y2="224"/><line x1="288" y1="210" x2="276" y2="224"/>
    <line x1="318" y1="210" x2="306" y2="224"/><line x1="348" y1="210" x2="336" y2="224"/>
  </g>
  <!-- block -->
  <rect x="150" y="138" width="100" height="72" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="200" y="180" text-anchor="middle" font-size="20" font-weight="800" fill="#92400e">m</text>
  <!-- applied force (blue, right) -->
  <line x1="250" y1="174" x2="332" y2="174" stroke="#1d4ed8" stroke-width="6" marker-end="url(#fb)"/>
  <text x="300" y="164" font-size="14" font-weight="800" fill="#1d4ed8">F</text>
  <!-- friction (red, left) -->
  <line x1="150" y1="174" x2="86" y2="174" stroke="#dc2626" stroke-width="6" marker-end="url(#fr)"/>
  <text x="104" y="164" font-size="14" font-weight="800" fill="#dc2626">f</text>
  <defs>
    <marker id="fb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/></marker>
    <marker id="fr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
