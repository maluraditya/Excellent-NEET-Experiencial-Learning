<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="400" height="300" rx="16" fill="#f8fafc"/>
  <rect x="8" y="8" width="384" height="284" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="200" y="46" text-anchor="middle" font-size="16" font-weight="800" fill="#16a34a">W_net = ΔKE</text>
  <!-- ground -->
  <line x1="40" y1="200" x2="360" y2="200" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- displacement bracket -->
  <line x1="96" y1="216" x2="300" y2="216" stroke="#64748b" stroke-width="1.5"/>
  <line x1="96" y1="210" x2="96" y2="222" stroke="#64748b" stroke-width="1.5"/>
  <line x1="300" y1="210" x2="300" y2="222" stroke="#64748b" stroke-width="1.5"/>
  <text x="198" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">d</text>
  <!-- block at end -->
  <rect x="246" y="138" width="84" height="62" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="288" y="174" text-anchor="middle" font-size="18" font-weight="800" fill="#0c4a6e">m</text>
  <!-- ghost start block -->
  <rect x="90" y="142" width="76" height="58" rx="10" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- applied force -->
  <line x1="330" y1="168" x2="356" y2="168" stroke="#1d4ed8" stroke-width="6" marker-end="url(#wb)"/>
  <text x="120" y="120" font-size="13.5" font-weight="800" fill="#1d4ed8">W = F d cosθ</text>
  <text x="262" y="120" font-size="13.5" font-weight="800" fill="#7c3aed">K = ½mv²</text>
  <defs><marker id="wb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1d4ed8"/></marker></defs>
</svg>
