<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Gametogenesis and Hormonal Regulation Infographic</title>
  <desc id="desc">Comparison of spermatogenesis and oogenesis with hypothalamic, pituitary, and gonadal hormone control.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#f0f9ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="88" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#17324d">Gametogenesis and Hormonal Regulation</text>
  <text x="82" y="130" font-family="Arial, sans-serif" font-size="22" fill="#475569">GnRH drives pituitary FSH and LH, which coordinate sperm production, ovulation, and sex-steroid feedback.</text>

  <g transform="translate(90 205)">
    <rect x="0" y="0" width="430" height="590" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="32" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0f766e">Male: Spermatogenesis</text>
    <circle cx="215" cy="120" r="42" fill="#bfdbfe" stroke="#2563eb" stroke-width="5"/>
    <text x="157" y="200" font-family="Arial, sans-serif" font-size="22" fill="#17324d">Spermatogonia</text>
    <line x1="215" y1="225" x2="215" y2="282" stroke="#0f766e" stroke-width="6" marker-end="url(#arrow)"/>
    <circle cx="215" cy="335" r="54" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
    <text x="137" y="420" font-family="Arial, sans-serif" font-size="22" fill="#17324d">Primary spermatocyte</text>
    <line x1="215" y1="445" x2="215" y2="500" stroke="#0f766e" stroke-width="6" marker-end="url(#arrow)"/>
    <g fill="#2563eb">
      <path d="M140 555 C172 530 198 530 230 555 C195 568 170 570 140 555 Z"/>
      <path d="M210 555 C242 530 268 530 300 555 C265 568 240 570 210 555 Z"/>
      <path d="M175 610 C207 585 233 585 265 610 C230 623 205 625 175 610 Z"/>
    </g>
    <text x="135" y="535" font-family="Arial, sans-serif" font-size="22" fill="#17324d">Spermatids -> sperm</text>
  </g>

  <g transform="translate(585 205)">
    <rect x="0" y="0" width="430" height="590" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="32" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#be185d">Female: Oogenesis</text>
    <circle cx="215" cy="130" r="52" fill="#fbcfe8" stroke="#db2777" stroke-width="5"/>
    <text x="142" y="215" font-family="Arial, sans-serif" font-size="22" fill="#17324d">Primary oocyte</text>
    <line x1="215" y1="240" x2="215" y2="300" stroke="#0f766e" stroke-width="6" marker-end="url(#arrow)"/>
    <circle cx="195" cy="360" r="62" fill="#f9a8d4" stroke="#be185d" stroke-width="5"/>
    <circle cx="290" cy="372" r="20" fill="#fce7f3" stroke="#be185d" stroke-width="4"/>
    <text x="118" y="455" font-family="Arial, sans-serif" font-size="22" fill="#17324d">Secondary oocyte + polar body</text>
    <line x1="215" y1="480" x2="215" y2="535" stroke="#0f766e" stroke-width="6" marker-end="url(#arrow)"/>
    <circle cx="215" cy="592" r="46" fill="#f472b6" stroke="#9d174d" stroke-width="5"/>
    <text x="138" y="535" font-family="Arial, sans-serif" font-size="22" fill="#17324d">Ovulation</text>
  </g>

  <g transform="translate(1080 205)">
    <rect x="0" y="0" width="430" height="590" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="32" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Hormone Axis</text>
    <rect x="88" y="100" width="254" height="62" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="145" y="140" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1e3a8a">Hypothalamus</text>
    <line x1="215" y1="168" x2="215" y2="222" stroke="#0f766e" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="235" y="202" font-family="Arial, sans-serif" font-size="22" fill="#475569">GnRH</text>
    <rect x="88" y="230" width="254" height="62" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="145" y="270" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#4c1d95">Pituitary</text>
    <line x1="165" y1="298" x2="135" y2="382" stroke="#0f766e" stroke-width="6" marker-end="url(#arrow)"/>
    <line x1="265" y1="298" x2="295" y2="382" stroke="#0f766e" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="105" y="360" font-family="Arial, sans-serif" font-size="22" fill="#475569">FSH</text>
    <text x="300" y="360" font-family="Arial, sans-serif" font-size="22" fill="#475569">LH</text>
    <rect x="55" y="405" width="140" height="72" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="91" y="449" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">Testis</text>
    <rect x="235" y="405" width="140" height="72" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
    <text x="272" y="449" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#9d174d">Ovary</text>
    <text x="66" y="535" font-family="Arial, sans-serif" font-size="22" fill="#17324d">Testosterone, estrogen, and progesterone feed back to brain and pituitary.</text>
  </g>
</svg>
