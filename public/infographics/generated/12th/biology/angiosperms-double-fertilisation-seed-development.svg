<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Double Fertilisation and Seed Development Infographic</title>
  <desc id="desc">Angiosperm reproduction sequence from pollen tube entry to zygote, endosperm, embryo, seed, and fruit formation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="90" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#17324d">Double Fertilisation in Angiosperms</text>
  <text x="82" y="132" font-family="Arial, sans-serif" font-size="22" fill="#475569">Two male gametes enter one embryo sac: one forms the zygote, the other forms triploid endosperm.</text>

  <g transform="translate(92 210)">
    <rect x="0" y="0" width="360" height="560" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">1. Pollen Tube Entry</text>
    <path d="M182 104 C102 150 82 240 112 330 C142 420 232 432 258 505" fill="none" stroke="#16a34a" stroke-width="18" stroke-linecap="round"/>
    <circle cx="182" cy="104" r="34" fill="#facc15" stroke="#ca8a04" stroke-width="5"/>
    <circle cx="220" cy="300" r="18" fill="#2563eb"/>
    <circle cx="248" cy="328" r="18" fill="#2563eb"/>
    <text x="54" y="520" font-family="Arial, sans-serif" font-size="20" fill="#475569">Pollen tube releases two male gametes near the egg apparatus.</text>
  </g>

  <g transform="translate(535 210)">
    <rect x="0" y="0" width="530" height="560" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">2. Embryo Sac</text>
    <ellipse cx="265" cy="295" rx="170" ry="230" fill="#fce7f3" stroke="#db2777" stroke-width="5"/>
    <circle cx="205" cy="178" r="30" fill="#f9a8d4"/>
    <circle cx="265" cy="178" r="30" fill="#f9a8d4"/>
    <circle cx="325" cy="178" r="30" fill="#f9a8d4"/>
    <circle cx="220" cy="405" r="40" fill="#fb7185" stroke="#be123c" stroke-width="4"/>
    <circle cx="310" cy="405" r="30" fill="#fecdd3" stroke="#be123c" stroke-width="3"/>
    <circle cx="245" cy="292" r="28" fill="#fde68a" stroke="#ca8a04" stroke-width="3"/>
    <circle cx="290" cy="292" r="28" fill="#fde68a" stroke="#ca8a04" stroke-width="3"/>
    <path d="M105 130 C145 210 150 320 230 405" fill="none" stroke="#16a34a" stroke-width="12" stroke-linecap="round"/>
    <circle cx="220" cy="360" r="16" fill="#2563eb"/>
    <circle cx="270" cy="292" r="16" fill="#2563eb"/>
    <text x="70" y="512" font-family="Arial, sans-serif" font-size="20" fill="#475569">Egg + male gamete = zygote. Polar nuclei + male gamete = primary endosperm nucleus.</text>
  </g>

  <g transform="translate(1145 210)">
    <rect x="0" y="0" width="360" height="560" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">3. Seed and Fruit</text>
    <ellipse cx="180" cy="230" rx="110" ry="150" fill="#fed7aa" stroke="#f97316" stroke-width="6"/>
    <path d="M150 310 C200 270 210 215 168 165" fill="none" stroke="#7c2d12" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="197" cy="235" rx="44" ry="74" fill="#fef3c7" stroke="#ca8a04" stroke-width="4"/>
    <circle cx="185" cy="198" r="18" fill="#16a34a"/>
    <text x="50" y="428" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">Ovary -> Fruit</text>
    <text x="50" y="468" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">Ovule -> Seed</text>
    <text x="50" y="510" font-family="Arial, sans-serif" font-size="20" fill="#475569">Endosperm nourishes the embryo during seed development.</text>
  </g>

  <line x1="455" y1="490" x2="525" y2="490" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="1068" y1="490" x2="1138" y2="490" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="505" y="795" width="590" height="58" rx="20" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="536" y="833" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Syngamy: n + n -> 2n zygote | Triple fusion: n + n + n -> 3n endosperm</text>
</svg>
