      <circle cx="1434" cy="397" r="3" fill="#1d4ed8"/><text x="1452" y="404" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">Start from y = [2a sin(kx)] cos(omega t)</text><circle cx="1434" cy="423" r="3" fill="#1d4ed8"/><text x="1452" y="430" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">Nodes have zero displacement</text><circle cx="1434" cy="449" r="3" fill="#1d4ed8"/><text x="1452" y="456" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">Avoid: Standing wave pattern does not travel along the</text>
