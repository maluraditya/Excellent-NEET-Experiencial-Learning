<text x="84" y="172" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="950" fill="#0b3a8a">STANDING WAVES?</text>
      <circle cx="54" cy="191" r="3" fill="#0b3a8a"/><text x="72" y="198" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">Opposite travelling waves superpose to form nodes and</text>
<text x="72" y="216" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">antinodes.</text><circle cx="54" cy="235" r="3" fill="#0b3a8a"/><text x="72" y="242" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">Nodes have zero displacement</text><circle cx="54" cy="261" r="3" fill="#0b3a8a"/><text x="72" y="268" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">Antinodes have maximum displacement</text>
