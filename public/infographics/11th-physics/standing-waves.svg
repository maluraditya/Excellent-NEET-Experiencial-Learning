<text x="58" y="390" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" fill="#0f172a">t)</text><rect x="44" y="409" width="452" height="42" rx="5" fill="#fbfdff" stroke="#1d4ed8" stroke-width="1.5"/><text x="58" y="435" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" fill="#0f172a">Node spacing = lambda/2</text><rect x="44" y="460" width="452" height="58" rx="5" fill="#fbfdff" stroke="#1d4ed8" stroke-width="1.5"/><text x="58" y="486" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" fill="#0f172a">String fixed ends: f_n = n</text>
<text x="58" y="508" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" fill="#0f172a">v / 2L</text><rect x="44" y="527" width="452" height="58" rx="5" fill="#fbfdff" stroke="#1d4ed8" stroke-width="1.5"/><text x="58" y="553" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" fill="#0f172a">Closed pipe: f_n = (n +</text>
<text x="58" y="575" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" fill="#0f172a">1/2) v / 2L</text>
