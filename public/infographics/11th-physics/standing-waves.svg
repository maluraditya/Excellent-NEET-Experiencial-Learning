<text x="72" y="913" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">and antinodes.</text><circle cx="54" cy="933" r="3" fill="#0f766e"/><text x="72" y="940" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">Ask students to label the diagram before solving.</text>
