  <text x="960" y="109" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-size="24" font-weight="950" fill="#0b3a8a">NCERT CLASS 11 PHYSICS - KINETIC THEORY</text>

  
    <g>
      <rect x="30" y="120" width="480" height="166" rx="8" fill="#ffffff" stroke="#0b3a8a" stroke-width="2.2"/>
      <circle cx="54" cy="140" r="17" fill="#e0f2fe" stroke="#111827" stroke-width="3"/><circle cx="54" cy="140" r="11" fill="#bae6fd" stroke="#ffffff" stroke-width="3"/><line x1="66" y1="153" x2="84" y2="174" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
      <text x="84" y="150" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="950" fill="#0b3a8a">WHAT IS PRESSURE OF AN</text>
<text x="84" y="172" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="950" fill="#0b3a8a">IDEAL GAS?</text>
      <circle cx="54" cy="191" r="3" fill="#0b3a8a"/><text x="72" y="198" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">Gas pressure comes from molecular collisions with</text>
<text x="72" y="216" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">container walls.</text><circle cx="54" cy="235" r="3" fill="#0b3a8a"/><text x="72" y="242" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">Temperature measures average molecular kinetic energy</text><circle cx="54" cy="261" r="3" fill="#0b3a8a"/><text x="72" y="268" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">Ideal gas assumes negligible molecular size and</text>
<text x="72" y="286" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">interactions</text>
    </g>
  
    <g>
      <rect x="30" y="306" width="480" height="270" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.2"/>
      <text x="46" y="337" font-family="Arial Narrow, Arial, sans-serif" font-size="22" font-weight="950" fill="#0b3a8a">FORMULA INSET</text>
      <rect x="44" y="342" width="452" height="42" rx="5" fill="#fbfdff" stroke="#1d4ed8" stroke-width="1.5"/><text x="58" y="368" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" fill="#0f172a">PV = mu R T = N kB T</text><rect x="44" y="393" width="452" height="42" rx="5" fill="#fbfdff" stroke="#1d4ed8" stroke-width="1.5"/><text x="58" y="419" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" fill="#0f172a">P = 1/3 n m &lt;v^2&gt;</text><rect x="44" y="444" width="452" height="42" rx="5" fill="#fbfdff" stroke="#1d4ed8" stroke-width="1.5"/><text x="58" y="470" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" fill="#0f172a">1/2 m &lt;v^2&gt; = 3/2 kB T</text><rect x="44" y="495" width="452" height="42" rx="5" fill="#fbfdff" stroke="#1d4ed8" stroke-width="1.5"/><text x="58" y="521" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850" fill="#0f172a">v_rms = sqrt(3kB T / m)</text>
    </g>
  
