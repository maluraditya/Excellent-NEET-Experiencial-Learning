<text x="1426" y="586" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="950" fill="#dc2626">MISCONCEPTIONS</text>
      <circle cx="1434" cy="607" r="3" fill="#dc2626"/><text x="1452" y="614" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">Molecules do not all</text>
