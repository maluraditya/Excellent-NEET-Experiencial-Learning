<text x="1452" y="632" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">suction</text><circle cx="1434" cy="651" r="3" fill="#dc2626"/><text x="1452" y="658" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">Viscosity and</text>
