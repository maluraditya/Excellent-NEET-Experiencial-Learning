      <circle cx="54" cy="191" r="3" fill="#0b3a8a"/><text x="72" y="198" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">Steady ideal flow conserves energy along a streamline.</text><circle cx="54" cy="217" r="3" fill="#0b3a8a"/><text x="72" y="224" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">Continuity follows mass conservation</text><circle cx="54" cy="243" r="3" fill="#0b3a8a"/><text x="72" y="250" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">Bernoulli applies to non-viscous steady flow</text>
<text x="72" y="268" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650" fill="#0f172a">approximately</text>
